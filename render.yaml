services:
  - type: web
    name: intego-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: MYSQL_DATABASE
        value: defaultdb
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_HOST
        value: intego-obedbenny54-6503.e.aivencloud.com
      - key: MYSQL_PORT
        value: "21329"
      - key: MYSQL_SSL_MODE
        value: REQUIRED
      - key: CORS_ALLOWED_ORIGINS
        sync: false
